experiment:
  name: EXP-005_ablation_perspective
  description: "Ablation model trained on EMNIST ByClass with perspective distortion augmentation only"

seed: 123

dataset:
  name: emnist_byclass
  num_classes: 62
  val_ratio: 0.1
  mean: 0.1331
  std: 0.2870

model:
  name: AlphanumericCNN
  in_channels: 1
  dropout: 0.5

training:
  batch_size: 512
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001

augmentation:
  blur: false
  blur_prob: 0.0
  noise: false
  noise_prob: 0.0
  perspective: true
  perspective_prob: 0.5
  max_perspective_severity: 0.25
