experiment:
  name: EXP-003_ablation_blur
  description: "Ablation model trained on EMNIST ByClass with Gaussian blur augmentation only"

seed: 123

dataset:
  name: emnist_byclass
  num_classes: 62
  val_ratio: 0.1
  mean: 0.1331
  std: 0.2870

model:
  name: AlphanumericCNN
  in_channels: 1
  dropout: 0.5

training:
  batch_size: 512
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001

augmentation:
  blur: true
  blur_prob: 0.5
  max_sigma: 2.0
  noise: false
  noise_prob: 0.0
  perspective: false
  perspective_prob: 0.0
