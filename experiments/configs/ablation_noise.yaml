experiment:
  name: EXP-004_ablation_noise
  description: "Ablation model trained on EMNIST ByClass with Gaussian noise augmentation only"

seed: 123

dataset:
  name: emnist_byclass
  num_classes: 62
  val_ratio: 0.1
  mean: 0.1331
  std: 0.2870

model:
  name: AlphanumericCNN
  in_channels: 1
  dropout: 0.5

training:
  batch_size: 512
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001

augmentation:
  blur: false
  blur_prob: 0.0
  noise: true
  noise_prob: 0.5
  max_noise_std: 0.15
  perspective: false
  perspective_prob: 0.0
