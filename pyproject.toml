[project]
name = "alphanumeric_ocr"
version = "0.2.0"
description = "Badanie odporności sieci CNN na degradacje środowiskowe w zadaniu klasyfikacji znaków alfanumerycznych EMNIST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "albumentations>=1.4.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "easyocr>=1.7.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
