[project]
name = "alphanumeric-ocr"
version = "0.2.0"
description = "Badanie odporności sieci CNN na degradacje środowiskowe w zadaniu klasyfikacji znaków alfanumerycznych EMNIST"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "albumentations>=1.4.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "easyocr>=1.7.0",
    "scipy>=1.12.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["experiments"]
testpaths = ["experiments/tests"]

[tool.ruff]
line-length = 120
src = ["experiments"]

[tool.ruff.lint.per-file-ignores]
"experiments/scripts/*.py" = ["E402"]
